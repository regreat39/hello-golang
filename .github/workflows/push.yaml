name: golang-pipeline
on: push
jobs:
    tests:
        runs-on: ubuntu-latest
        container: golang:1.25.6
        steps:
            - uses: actions/checkout@v7
            
            - name: Run Unit Tests
              run: GOOS=linux GOARCH=amd64 go test

            - name: Vet
              run: |
                go vet ./...
